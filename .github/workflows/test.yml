name: Test

# Runs standalone against a PR, and is also called by deploy.yml so a push to
# master is held to the exact same bar rather than a second, looser copy of it.
on:
    pull_request:
        branches: [master]
    workflow_call:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Node
              uses: actions/setup-node@v7
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright's browser
              run: npx playwright install --with-deps chromium

            - name: Typecheck, unit tests, build, and the E2E suite
              run: npm run test:all
